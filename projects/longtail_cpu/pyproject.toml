[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longtail-jamming"
version = "0.1.0"
description = "Config-driven multi-label compound-jamming baseline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1",
  "numpy==1.26.4",
  "h5py==3.12.1",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
]

[project.scripts]
longtail-train = "longtail.train:main"
longtail-evaluate = "longtail.evaluate:main"
longtail-data = "longtail.data.manage:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
