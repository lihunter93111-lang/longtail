data:
  classes: [FMB, AMA, SawFM, SinFM, MFT, ISRJ]
  train: ${AMA_DATA_ROOT}/train.h5
  development: ${AMA_DATA_ROOT}/development.h5
  split: ${AMA_DATA_ROOT}/split.json
backbone: {width: 16, dropout: 0.2}
training:
  epochs: 24
  steps_per_epoch: 250
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.0001
  sampler: uniform  # uniform, label_aware, combo_aware, mixed_combo
  loss: bce         # bce, weighted_bce, logit_adjustment
  selection_metric: macro_aupr
