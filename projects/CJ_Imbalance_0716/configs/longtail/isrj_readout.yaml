data:
  classes: [FMB, AMA, SawFM, SinFM, MFT, ISRJ]
  train: ${AMA_DATA_ROOT}/train.h5
  development: ${AMA_DATA_ROOT}/development.h5
  split: ${AMA_DATA_ROOT}/split.json
reference: ${AMA_REFERENCE_MODEL}
